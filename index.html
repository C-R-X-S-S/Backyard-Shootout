<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121a3d">
<meta name="robots" content="noindex,nofollow,noimageindex">
<title>Backyard Shootout</title>
<style>
:root{--navy:#121a3d;--navy2:#1f2c66;--yellow:#ffd23f;--yellow2:#d9a800;--green:#2fc46a;--red:#ff4d5e;--sky:#4f9bf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1430;color:#fff;overscroll-behavior:none;touch-action:none;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}
.screen.dim{background:linear-gradient(180deg,rgba(12,20,58,.25) 0%,rgba(12,20,58,.55) 45%,rgba(10,16,46,.92) 100%)}
.screen.solid{background:rgba(10,16,46,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.screen > *{flex:none}

.logo{text-align:center;transform:rotate(-4deg);margin:0 0 10px}
.logo .l1{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:900;font-size:clamp(16px,4.6vw,26px);letter-spacing:.22em;
  padding:5px 14px 5px 18px;border-radius:8px;box-shadow:4px 4px 0 var(--navy)}
.logo .l2{display:block;margin-top:6px;font-weight:900;font-style:italic;font-size:clamp(50px,15.5vw,108px);line-height:.92;letter-spacing:-.02em;color:#fff;
  -webkit-text-stroke:4px var(--navy);paint-order:stroke fill;text-shadow:0 7px 0 var(--navy),0 14px 26px rgba(0,0,0,.45)}
.tag{font-weight:800;opacity:.85;font-size:14px;letter-spacing:.06em;text-align:center;margin-top:-4px}

.stack{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px;align-items:stretch}
.btn{appearance:none;border:0;font-weight:900;font-size:19px;letter-spacing:.05em;color:var(--navy);background:var(--yellow);
  padding:15px 20px;border-radius:16px;box-shadow:0 6px 0 var(--yellow2),0 12px 22px rgba(0,0,0,.3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .07s,box-shadow .07s;text-transform:uppercase}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--yellow2),0 4px 10px rgba(0,0,0,.3)}
.btn.alt{background:#fff;box-shadow:0 6px 0 #b9c4e2,0 12px 22px rgba(0,0,0,.3)}
.btn.alt:active{box-shadow:0 2px 0 #b9c4e2}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.3);font-size:16px;padding:12px 18px}
.btn.ghost:active{transform:translateY(2px)}
.btn small{display:block;font-size:11px;letter-spacing:.06em;opacity:.7;font-weight:800;text-transform:none}
.btn .ico{font-size:22px}
.btn .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.row{display:flex;gap:10px;width:100%;max-width:360px}
.row > *{flex:1}

h2{margin:0;font-weight:900;font-style:italic;font-size:clamp(26px,7vw,40px);letter-spacing:.01em;text-transform:uppercase;
  -webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:0 4px 0 var(--navy)}
.sub{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}

/* player cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.card{position:relative;background:#fff;color:var(--navy);border-radius:18px;padding:12px 8px 10px;text-align:center;cursor:pointer;
  box-shadow:0 5px 0 #b9c4e2,0 10px 20px rgba(0,0,0,.25);border:3px solid transparent;transition:transform .12s}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--yellow);background:#fffbe8;box-shadow:0 5px 0 var(--yellow2),0 0 0 4px rgba(255,210,63,.35),0 10px 20px rgba(0,0,0,.25)}
.card.dis{opacity:.45}
.card .face{background-color:#fff;width:min(84px,22vw);height:min(84px,22vw);margin:0 auto 6px;border-radius:50%;background-size:cover;background-position:center;
  border:4px solid var(--navy);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.card .nm{font-weight:900;font-size:16px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:4px;min-height:20px}
.card .edit{border:0;background:none;padding:2px 4px;font-size:13px;cursor:pointer;opacity:.6}
.card .trait{font-size:10.5px;font-weight:700;opacity:.65;min-height:26px;margin:3px 0 6px;line-height:1.2}
.stat{display:block;font-size:10px;font-weight:900;letter-spacing:.02em;margin-top:4px;text-align:left}
.stat b{display:block;opacity:.7;line-height:1.1;margin-bottom:2px}
.stat i{flex:1;height:6px;border-radius:4px;background:#e3e7f2;overflow:hidden;display:block}
.stat i u{display:block;height:100%;background:linear-gradient(90deg,#2f7bf5,#36c4ff);border-radius:4px}
.badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--yellow);font-size:11px;font-weight:900;
  letter-spacing:.08em;padding:3px 9px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.badge.k{background:#e84a5f;color:#fff}

.seg{display:flex;background:rgba(255,255,255,.12);border-radius:14px;padding:4px;width:100%;max-width:360px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:900;font-size:14px;letter-spacing:.05em;cursor:pointer;color:#fff;text-transform:uppercase}
.seg button.on{background:#fff;color:var(--navy)}
.lbl{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.75;width:100%;max-width:360px;margin-bottom:-6px}

.opps{display:flex;gap:12px;justify-content:center}
.opp{background-color:#fff;width:58px;height:58px;border-radius:50%;background-size:cover;border:4px solid rgba(255,255,255,.35);cursor:pointer;position:relative}
.opp.sel{border-color:#e84a5f;box-shadow:0 0 0 4px rgba(232,74,95,.35)}
.opp.dis{opacity:.25;pointer-events:none}
.opp.rnd{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);font-size:24px;font-weight:900}

.toggles{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px}
.tog{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer}
.tog .sw{width:46px;height:28px;border-radius:20px;background:rgba(255,255,255,.25);position:relative;transition:background .15s;flex:none}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on .sw{background:var(--green)}
.tog.on .sw::after{left:21px}

/* result */
.winface{background-color:#fff;width:132px;height:132px;border-radius:50%;background-size:cover;border:6px solid var(--yellow);box-shadow:0 8px 0 var(--navy),0 0 0 10px rgba(255,210,63,.25);position:relative;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.crown{position:absolute;top:-38px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:46px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.final{font-weight:900;font-size:56px;letter-spacing:.02em;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;text-shadow:0 5px 0 var(--navy)}
.final span{color:var(--yellow)}
.recap{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;width:100%;max-width:360px}
.recap .rr{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.recap .rr .pf{background-color:#fff;width:28px;height:28px;border-radius:50%;background-size:cover;border:2px solid #fff;flex:none}
.recap .rr .nm{width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,10,30,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;color:var(--navy);border-radius:20px;padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 #b9c4e2}
.modal input{font:inherit;font-weight:900;font-size:20px;padding:12px 14px;border-radius:12px;border:3px solid var(--navy);width:100%;color:var(--navy);-webkit-user-select:text;user-select:text}
.modal .t{font-weight:900;font-size:18px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.sb{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;width:min(600px,calc(100% - 16px))}
.team{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(18,26,61,.9);border-radius:16px;padding:6px 10px 6px 6px;
  box-shadow:0 4px 0 rgba(0,0,0,.25);border:3px solid transparent;transition:border-color .2s}
.team.right{flex-direction:row-reverse;padding:6px 6px 6px 10px}
.team.right .meta{text-align:right}
.team.right .dots{justify-content:flex-end}
.team.on{border-color:var(--yellow)}
.team .pf{background-color:#fff;width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #fff;flex:none}
.team .meta{min-width:0;flex:1}
.team .nm{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.team .gl{font-weight:900;font-size:30px;min-width:26px;text-align:center;color:var(--yellow);line-height:1}
.dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
.dot.g{background:var(--green);border-color:#b6f5cf}
.dot.m{background:var(--red);border-color:#ffc2c8}
.dot.now{border-color:var(--yellow);animation:blink .9s infinite}
.mid{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 64px);left:50%;transform:translateX(-50%);background:var(--yellow);color:var(--navy);
  font-weight:900;font-size:12px;letter-spacing:.14em;padding:4px 12px;border-radius:20px;white-space:nowrap;box-shadow:0 3px 0 var(--yellow2)}
#pauseBtn{position:absolute;pointer-events:auto;bottom:max(14px,env(safe-area-inset-bottom));right:14px;width:46px;height:46px;border-radius:50%;border:0;
  background:rgba(18,26,61,.75);font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#sndBtn{position:absolute;pointer-events:auto;top:calc(max(10px,env(safe-area-inset-top)) + 60px);right:10px;width:42px;height:42px;border-radius:50%;border:0;
  background:rgba(18,26,61,.75);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
#sndBtn svg{width:24px;height:24px;display:block}
#sndBtn .x{display:none} #sndBtn.off .x{display:block} #sndBtn.off .w{display:none}
#audioDbg{position:fixed;left:6px;bottom:6px;z-index:99;background:rgba(0,0,0,.8);color:#7f7;font:11px/1.3 monospace;padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:none}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;opacity:0}
#banner .b1{display:inline-block;background:var(--navy);color:#fff;font-weight:900;font-style:italic;font-size:clamp(24px,7vw,40px);
  padding:8px 22px;border-radius:12px;transform:skewX(-8deg);box-shadow:5px 5px 0 var(--yellow);text-transform:uppercase;letter-spacing:.02em}
#banner .b2{margin-top:10px;font-weight:800;font-size:14px;letter-spacing:.08em;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#banner.show{animation:bannerIn 1.25s ease forwards}
#toast{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0}
#toast .t1{font-weight:900;font-style:italic;font-size:clamp(46px,14vw,96px);line-height:1;letter-spacing:-.01em;-webkit-text-stroke:4px var(--navy);
  paint-order:stroke fill;text-shadow:0 7px 0 var(--navy),0 12px 30px rgba(0,0,0,.4);text-transform:uppercase}
#toast .t2{margin-top:10px;display:inline-block;background:rgba(18,26,61,.85);font-weight:900;font-size:14px;padding:6px 14px;border-radius:20px;letter-spacing:.06em}
#toast.show{animation:toastIn 1.9s cubic-bezier(.2,1.4,.4,1) forwards}
#toast.good .t1{color:var(--yellow)}
#toast.bad .t1{color:#fff}
#hint{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 100px);transform:translateX(-50%);background:rgba(18,26,61,.88);
  border-radius:16px;padding:10px 16px;font-weight:800;font-size:14px;text-align:center;width:max-content;max-width:calc(100% - 32px);line-height:1.35;
  box-shadow:0 4px 0 rgba(0,0,0,.25);transition:opacity .3s}
#hint b{color:var(--yellow)}
#kickInfo{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(18,26,61,.8);border-radius:20px;
  padding:6px 14px;font-weight:900;font-size:13px;letter-spacing:.05em;opacity:0;transition:opacity .25s;white-space:nowrap}
#kickInfo.show{opacity:1}
#fade{position:fixed;inset:0;background:#0d1430;opacity:0;pointer-events:none;z-index:8;transition:opacity .18s}

@keyframes bannerIn{0%{opacity:0;transform:translateX(-40px)}15%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40px)}}
@keyframes toastIn{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes blink{50%{border-color:rgba(255,210,63,.2)}}
@keyframes floaty{50%{transform:translateY(-6px) rotate(-4deg)}}
.logo{animation:floaty 3.2s ease-in-out infinite}
@media (min-height:760px){.card .trait{min-height:28px}}
@media (orientation:landscape) and (max-height:500px){
  .logo .l2{font-size:56px}.screen{gap:10px;justify-content:flex-start}.card .trait{display:none}.card .face{width:60px;height:60px}
  #toast .t1{font-size:54px}#banner{top:24%}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="fade"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="sb">
    <div class="team" id="tA"><div class="pf" id="tApf"></div><div class="meta"><div class="nm" id="tAnm"></div><div class="dots" id="tAd"></div></div><div class="gl" id="tAg">0</div></div>
    <div class="team right" id="tB"><div class="pf" id="tBpf"></div><div class="meta"><div class="nm" id="tBnm"></div><div class="dots" id="tBd"></div></div><div class="gl" id="tBg">0</div></div>
  </div>
  <div class="mid" id="midLbl">ROUND 1</div>
  <div id="banner"><div class="b1" id="bn1"></div><div class="b2" id="bn2"></div></div>
  <div id="toast"><div class="t1" id="ts1"></div><div class="t2" id="ts2"></div></div>
  <div id="hint" class="hidden"></div>
  <div id="kickInfo"></div>
  <button id="pauseBtn" aria-label="Pause">❚❚</button>
  <button id="sndBtn" aria-label="Sound on/off"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/><g class="w"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g>
    <g class="x"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
</div>

<!-- TITLE -->
<div class="screen dim" id="scTitle">
  <div style="flex:1 1 0;min-height:10px"></div>
  <div class="logo"><span class="l1">BACKYARD</span><span class="l2">SHOOTOUT</span></div>
  <div class="tag">⚽ Swipe. Curl. Score. Save. ⚽</div>
  <div class="stack" style="margin-top:8px">
    <button class="btn" data-mode="cpu"><span class="ico">🏆</span><span class="txt">Shootout<small>5 kicks each vs the computer</small></span></button>
    <button class="btn alt" data-mode="pnp"><span class="ico">📱</span><span class="txt">Pass &amp; Play<small>2 players, one phone</small></span></button>
    <button class="btn alt" data-mode="target"><span class="ico">🎯</span><span class="txt">Target Challenge<small>10 balls · hit the rings</small></span></button>
    <button class="btn ghost" id="btnSettings">⚙️ Settings</button>
  </div>
  <div style="flex:1 1 0;min-height:10px"></div>
</div>

<!-- SELECT -->
<div class="screen solid hidden" id="scSelect">
  <div class="sub" id="selSub">Shootout</div>
  <h2 id="selTitle">Choose your player</h2>
  <div class="cards" id="cards"></div>
  <div class="lbl hidden" id="oppLbl">Opponent</div>
  <div class="opps hidden" id="opps"></div>
  <div class="lbl" id="diffLbl">Difficulty</div>
  <div class="seg" id="diffSeg"><button data-d="0">Easy</button><button data-d="1">Normal</button><button data-d="2">Hard</button></div>
  <div class="stack" style="margin-top:6px">
    <button class="btn" id="btnStart">Kick off ⚽</button>
    <button class="btn ghost" id="btnBack">← Back</button>
  </div>
</div>

<!-- PASS -->
<div class="screen solid hidden" id="scPass">
  <div class="sub">Pass the phone to</div>
  <div class="winface" id="passFace" style="animation:none"></div>
  <h2 id="passName">Player</h2>
  <div class="tag" id="passInfo"></div>
  <div class="stack"><button class="btn" id="btnPassGo">I'm ready!</button></div>
</div>

<!-- PAUSE -->
<div class="screen solid hidden" id="scPause">
  <h2>Paused</h2>
  <div class="toggles" id="pauseToggles"></div>
  <div class="stack">
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn alt" id="btnRestart">Restart</button>
    <button class="btn ghost" id="btnQuit">Quit to menu</button>
  </div>
</div>

<!-- SETTINGS -->
<div class="screen solid hidden" id="scSettings">
  <h2>Settings</h2>
  <div class="lbl">Difficulty</div>
  <div class="seg" id="diffSeg2"><button data-d="0">Easy</button><button data-d="1">Normal</button><button data-d="2">Hard</button></div>
  <div class="toggles" id="setToggles"></div>
  <div class="stack"><button class="btn" id="btnSetDone">Done</button></div>
</div>

<!-- RESULT -->
<div class="screen solid hidden" id="scResult">
  <div class="sub" id="resSub">Full time</div>
  <div style="height:30px"></div>
  <div class="winface" id="resFace"><div class="crown">👑</div></div>
  <h2 id="resTitle">You win!</h2>
  <div class="final" id="resScore">4 <span>–</span> 3</div>
  <div class="recap" id="resRecap"></div>
  <div class="stack">
    <button class="btn" id="btnAgain">Play again</button>
    <button class="btn ghost" id="btnMenu">Menu</button>
  </div>
</div>

<div class="modal hidden" id="nameModal"><div class="box">
  <div class="t">Player name</div>
  <input id="nameInput" maxlength="12" autocomplete="off" enterkeyhint="done">
  <button class="btn" id="nameSave">Save</button>
</div></div>

<script>
'use strict';
/* =========================================================

const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);};
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(ax+t*dx-px,ay+t*dy-py);}

// Android etc: navigator.vibrate. iPhone (Safari, Brave, every iOS browser) has no vibrate API; on iOS 18+ toggling a
// hidden <input type=checkbox switch> via its label plays the system haptic tick, so a pattern becomes one tick per pulse.
function iosTick(){ try{ const l=document.createElement('label'); l.ariaHidden='true'; l.style.display='none';
  const i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch',''); l.appendChild(i);
  document.head.appendChild(l); l.click(); document.head.removeChild(l); }catch(e){} }
const buzz = pat => { if(!settings.haptics) return;
  if(navigator.vibrate){ if(!navigator.userActivation || navigator.userActivation.hasBeenActive) try{navigator.vibrate(pat);}catch(e){} return; }
  const arr=Array.isArray(pat)?pat:[pat]; let t=0; arr.forEach((v,k)=>{ if(k%2===0) (t?setTimeout(iosTick,t):iosTick()); t+=v+(k%2===0?40:0); }); };

// Use navigator.audioSession where it exists (Safari 17+); otherwise loop a silent <audio> element,
// which puts the page in the media-playback category. Unlock on real gestures (touchend/click/key),
// and resume after the context is suspended/interrupted (app switch, phone call, screen lock).
let silentEl=null;
function silentWavURL(){ const sr=22050, n=sr, b=new ArrayBuffer(44+n*2), v=new DataView(b), w=(o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  let bin=''; const u=new Uint8Array(b); for(let i=0;i<u.length;i++) bin+=String.fromCharCode(u[i]); return 'data:audio/wav;base64,'+btoa(bin); }
let audioErr='';
function audioInit(){
  try{ if(navigator.audioSession && navigator.audioSession.type!=='playback') navigator.audioSession.type='playback'; }catch(e){}
  if(settings.sound){
    try{ if(!silentEl){ silentEl=document.createElement('audio'); silentEl.setAttribute('x-webkit-airplay','deny'); silentEl.setAttribute('playsinline','');
        silentEl.disableRemotePlayback=true; silentEl.controls=false; silentEl.preload='auto'; silentEl.loop=true; silentEl.src=silentWavURL();
        silentEl.style.display='none'; document.body.appendChild(silentEl); silentEl.load(); }
      if(silentEl.paused){ const pr=silentEl.play(); if(pr&&pr.catch) pr.catch(e=>{ audioErr='silent: '+(e&&e.name||e); }); } }catch(e){ audioErr='silent: '+e; }
  } else if(silentEl && !silentEl.paused) silentEl.pause();
  if(!actx){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      master=actx.createGain(); master.gain.value=.55; master.connect(actx.destination);
      noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){ actx=null; audioErr='ctx: '+e; return; }
  }
  if(actx.state!=='running'){ try{ const pr=actx.resume(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
    // a 1-sample buffer played inside the gesture is what actually unlocks older iOS
    try{ const sb=actx.createBufferSource(); sb.buffer=actx.createBuffer(1,1,22050); sb.connect(actx.destination); sb.start(0); }catch(e){} }

['touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,audioInit,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(silentEl) silentEl.pause(); if(actx&&actx.state==='running') actx.suspend().catch(()=>{}); }
});
function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
function osc(type,f0,f1,t,a,peak,dec,dest){ const o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+a+dec); env(g,t,a,peak,dec); o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+a+dec+.05); return o; }

  const g=actx.createGain(); env(g,t,a,peak,dec); s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()*.5); s.stop(t+a+dec+.05); return f; }
function sfx(n,v=1){
  if(!actx||!settings.sound) return; if(actx.state!=='running'){ try{ actx.resume().catch(()=>{}); }catch(e){} } const t=actx.currentTime;
  switch(n){
    case 'kick': osc('sine',160,42,t,.004,.9*v,.16); noise(t,.002,.35*v,.05,'highpass',1800); break;
    case 'net': noise(t,.03,.5,.45,'bandpass',1100,.6); noise(t,.01,.25,.2,'highpass',3000); break;
    case 'post': osc('triangle',1180,1150,t,.002,.32,.9); osc('sine',1770,1700,t,.002,.18,.7); osc('sine',2650,0,t,.002,.08,.4); break;
    case 'thud': osc('sine',95,40,t,.003,.6*v,.18); noise(t,.002,.3*v,.1,'lowpass',500); break;
    case 'bounce': osc('sine',120,60,t,.003,.25*v,.1); break;
    case 'save': noise(t,.002,.7,.14,'lowpass',900); osc('sine',210,70,t,.003,.6,.15); break;
    case 'whistle': { const o=osc('sine',2300,0,t,.02,.22,.32); const l=actx.createOscillator(),lg=actx.createGain(); l.frequency.value=34; lg.gain.value=140; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+.4); break; }
    case 'whistle3': ['whistle','whistle','whistle'].forEach((_,i)=>setTimeout(()=>sfx('whistle'),i*260)); break;
    case 'cheer': { noise(t,.25,.32,1.6,'bandpass',1500,.45); noise(t,.4,.18,1.4,'bandpass',700,.6); for(let i=0;i<5;i++){ const st=t+rand(0,.5); osc('triangle',rand(420,620),rand(800,1100),st,.05,.05,.35);} break; }
    case 'groan': noise(t,.2,.18,.9,'lowpass',500); osc('sawtooth',260,150,t,.15,.05,.8); break;
    case 'bark': [0,.17].forEach(d=>{ const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1600; f.connect(master); osc('square',560,280,t+d,.005,.16,.1,f); noise(t+d,.003,.12,.08,'bandpass',900,1); }); break;
    case 'click': osc('sine',720,540,t,.002,.18,.06); break;
    case 'swoosh': noise(t,.04,.22,.2,'bandpass',2200,.8); break;
  }
}

const cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const CAMS={ shoot:{x:0,y:1.45,z:-4.6}, keep:{x:0,y:2.3,z:-6.8} };
let cam=CAMS.shoot, bgCache={};

function fitCam(c){
  const land = W > H*1.15;
  const yTop = (land?.21:.35)*H, yBall=(land?.9:.85)*H;
  const d1=GOAL_Z-c.z, d2=-c.z;
  let f=(yBall-yTop)/(c.y/d2-(c.y-GOAL_H)/d1);
  f=Math.min(f,(land?.6:.88)*W*d1/GOAL_W);
  c.f=f; c.cx=W/2; c.hy=yBall-c.y*f/d2;
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  fitCam(CAMS.shoot); fitCam(CAMS.keep); bgCache={};
}
window.addEventListener('resize',resize);
const proj=(c,x,y,z)=>{ const d=Math.max(z-c.z,.05), s=c.f/d; return {x:c.cx+(x-c.x)*s, y:c.hy-(y-c.y)*s, s}; };
const unproj=(c,sx,sy,z)=>{ const d=z-c.z; return {x:c.x+(sx-c.cx)*d/c.f, y:c.y+(c.hy-sy)*d/c.f}; };

const R0=mulberry32(20261126);
const TREES=(()=>{ const t=[], R=R0;
  for(let i=0;i<40;i++) t.push({k:'oak',x:-38+R()*76,z:22+R()*14,h:3.6+R()*2.8,w:4+R()*4,seed:R()*1e9|0});

  t.push({k:'pine',x:-3.2,z:21,h:20,seed:77},{k:'pine',x:4.6,z:23.5,h:17,seed:91},{k:'pine',x:-8,z:20,h:18,seed:13},{k:'pine',x:9,z:21,h:19,seed:5});
  return t.sort((a,b)=>b.z-a.z); })();

function drawOak(g,c,t){
  const R=mulberry32(t.seed), b=proj(c,t.x,0,t.z), s=b.s;
  g.fillStyle='#3a2c21'; g.fillRect(b.x-.22*s,b.y-t.h*.55*s,.44*s,t.h*.55*s);
  const cols=['#243f1d','#2c4a22','#35562a','#3f6431','#4b743a'];
  for(let L=0;L<5;L++) for(let i=0;i<7;i++){
    const dx=(R()-.5)*t.w, dy=t.h*(.45+R()*.45)+L*.12, r=.7+R()*1.0;
    g.fillStyle=cols[L]; g.beginPath(); g.arc(b.x+(dx-L*.12)*s,b.y-dy*s,r*s*(1-L*.12),0,7); g.fill();
  }
}
function drawPine(g,c,t){
  const R=mulberry32(t.seed), b=proj(c,t.x,0,t.z), s=b.s;
  // trunk
  g.fillStyle='#4a3527'; g.beginPath(); g.moveTo(b.x-.22*s,b.y); g.lineTo(b.x-.06*s,b.y-t.h*s); g.lineTo(b.x+.06*s,b.y-t.h*s); g.lineTo(b.x+.22*s,b.y); g.fill();
  g.fillStyle='rgba(255,220,170,.18)'; g.fillRect(b.x-.18*s,b.y-t.h*.95*s,.08*s,t.h*.95*s);

  for(let i=0;i<n;i++){ const fy=.38+.62*(i/(n-1)), side=i%2?1:-1; const spread=(.9+R()*1.6)*(1.15-fy*.7);

  clumps.push({x:0,y:t.h,w:1.1});

  clumps.forEach(k=>{ g.beginPath(); g.moveTo(b.x,b.y-(k.y-.6)*s); g.lineTo(b.x+k.x*s,b.y-k.y*s); g.stroke(); });

  layers.forEach(([col,ox,oy],li)=>{ g.fillStyle=col;
    clumps.forEach(k=>{ const m=li===3?3:8; for(let j=0;j<m;j++){ const a=R()*6.28, rr=R();
      const px=k.x+Math.cos(a)*k.w*rr*.9+ox*k.w, py=k.y+Math.sin(a)*k.w*.45*rr-oy*k.w; const r=(.28+R()*.36)*(li===3?.7:1);
      g.beginPath(); g.arc(b.x+px*s,b.y-py*s,r*s,0,7); g.fill(); } }); });
}

function buildBG(c){

  const g=o.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);

    const a=P(x0,0,zf),b=P(x1,0,zf),d=P(x1,0,zn),e=P(x0,0,zn);
    g.fillStyle=(i&1)?'rgba(255,255,170,.075)':'rgba(0,40,0,.06)'; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.lineTo(d.x,d.y); g.lineTo(e.x,e.y); g.fill(); }

    g.strokeStyle=R()<.5?'rgba(30,70,15,.35)':'rgba(200,230,120,.28)'; g.lineWidth=u*1.6+.4;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(R()-.5)*l*.6,y-l); g.stroke(); }

      g.fillStyle=woods[(R()*woods.length)|0]; g.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);

    const p1=P(-3.5,.75,WALL_Z-.25), p2=P(-3.4,0,WALL_Z-.25); g.fillStyle='#d9d2c0'; g.fillRect(p1.x,p1.y,p2.x-p1.x,p2.y-p1.y); }

}

const S = {screen:'title', mode:'cpu', A:null, B:null, K:null, res:{A:[],B:[]}, side:'A', phase:'idle', phaseT:0,
  simT:0, ts:1, outcome:null, paused:false, hints:{shoot:0,keep:0}, target:{score:0,shots:0,streak:0,rings:[]}, lastShot:null};
let ball=null, keeper=null, shooter=null, clock=0, shake=0, netHits=[], parts=[], swipe=null, trail=[], cue=null, shotsSinceDog=0;

function newBall(){ return {x:0,y:BALL_R,z:0,vx:0,vy:0,vz:0,ax:0,rx:0,ry:0,flying:false,crossed:false,passedK:false,inNet:false,held:null,gone:false,hist:[]}; }
function makeKeeper(p,isUser){ return {p,isUser,homeX:0,plan:null}; }

// ---------- keeper ----------
function keeperPose(k,t){
  const h=k.p.height, pl=k.plan;
  if(!pl || t<pl.t0){
    const ready = S.phase==='aim'||S.phase==='runup'||S.phase==='flight'||S.phase==='dogsteal';
    const sw = ready ? Math.sin(clock*(k.isUser?3:2.3))*(k.isUser?.05:.16) : Math.sin(clock*1.3)*.25;
    const bob = Math.abs(Math.sin(clock*4.6))*.025*h;
    return {x:k.homeX+sw, y:.5*h-(ready?.04*h:0)-bob, a:0, arms:ready?.3:.15, dive:0, crouch:ready?.5:.1, fall:0};
  }
  const u=clamp((t-pl.t0)/pl.Td,0,1), e=1-Math.pow(1-u,2.2), wide=Math.abs(pl.ta)>.5;
  let x=lerp(pl.fx,pl.tx,e), y=lerp(pl.fy,pl.ty,e)+Math.sin(u*Math.PI)*.15*Math.abs(Math.sin(pl.ta)), a=pl.ta*e, fall=0;
  if(u>=1){ const tf=t-pl.t0-pl.Td;
    if(wide){ y=Math.max(.14,pl.ty-.5*G*tf*tf); a=pl.ta+Math.sign(pl.ta)*Math.min(1,tf*2.5)*(1.52-Math.abs(pl.ta)); fall=Math.min(1,tf*2); }
    else { y=Math.max(.5*h*.92,pl.ty-.5*G*tf*tf); a=pl.ta*(1-Math.min(1,tf*2.5)); } }
  return {x,y,a,arms:1,dive:Math.abs(pl.ta)>.3?Math.min(1,e*1.4):.3, crouch:0, fall};
}
function keeperSegs(k,pose){
  const h=k.p.height, dx=Math.sin(pose.a), dy=Math.cos(pose.a), up=lerp(.42,.57,pose.dive)*h;
  return {hx:pose.x+dx*up, hy:pose.y+dy*up, fx:pose.x-dx*.5*h, fy:pose.y-dy*.5*h, rad:.16*Math.sqrt(h/1.3)+.03};
}
function planDive(k,tx,ty,t0,Td){
  const p=k.p, h=p.height, K=p.keeping/100, cur=keeperPose(k,t0);
  let a=Math.atan2(tx-cur.x, Math.max(ty-.35*h,.05)); a=clamp(a,-1.45,1.45);
  const near=Math.abs(tx-cur.x)<.32*h/1.3+.12;
  if(near && ty<1.05*h) a=clamp((tx-cur.x)*.5,-.25,.25);
  const reach=.57*h; let cx=tx-Math.sin(a)*reach, cy=ty-Math.cos(a)*reach;
  const maxLat=.85+1.0*K, maxY=.5*h+.2+.4*K+(p.id==='rookie'?.3:0);
  cx=clamp(cx,cur.x-maxLat,cur.x+maxLat); cy=clamp(cy,Math.abs(a)<.5?.4*h:.14,maxY);
  k.plan={t0,Td,fx:cur.x,fy:cur.y,tx:cx,ty:cy,ta:a};
}

// ---------- ball physics ----------
const netDepth=y=>lerp(NET_D0,NET_D1,clamp(y/GOAL_H,0,1));
function predictCross(b,zPlane){
  let x=b.x,y=b.y,z=b.z,vx=b.vx,vy=b.vy,vz=b.vz,ax=b.ax,t=0; const h=1/240;
  while(z<zPlane && t<3){ vx+=ax*h; vy-=G*h; x+=vx*h; y+=vy*h; z+=vz*h; t+=h; if(y<BALL_R){ y=BALL_R; if(vy<0){vy=-vy*.5; vx*=.8; vz*=.8; ax=0;} } if(vz<=0.05) break; }
  return {x,y,t,ok:z>=zPlane};
}
function launch(tx,ty,speed,curl){
  const b=ball, dz=GOAL_Z-b.z, d=Math.hypot(tx-b.x,dz), T=d/speed;
  b.vz=dz/T; b.vx=(tx-b.x-.5*curl*T*T)/T; b.vy=(ty-b.y+.5*G*T*T)/T; b.ax=curl; b.flying=true;
}
function stepBall(h){
  const b=ball; if(!b.flying||b.gone) return;
  if(b.held){ const pose=keeperPose(b.held,S.simT), sg=keeperSegs(b.held,pose); b.x=lerp(pose.x,sg.hx,.75); b.y=Math.max(BALL_R,lerp(pose.y,sg.hy,.75)); b.z=KEEPER_Z-.18; return; }
  const pz=b.z;
  b.vx+=b.ax*h; b.vy-=G*h; b.x+=b.vx*h; b.y+=b.vy*h; b.z+=b.vz*h;
  const sp=Math.hypot(b.vx,b.vz); b.rx+=b.vz*h/BALL_R; b.ry+=(b.vx*.6+b.ax*.12)*h/BALL_R;
  if(b.y<BALL_R){ b.y=BALL_R; if(b.vy<0){ if(b.vy<-2) sfx('bounce',Math.min(1,-b.vy/8)); b.vy=-b.vy*.5; if(b.vy<.6) b.vy=0; b.vx*=.82; b.vz*=.82; b.ax=0; } else { b.vx*=1-1.2*h; b.vz*=1-1.2*h; } }
  // dog interception
  if(S.dogBlocker && !b.passedDog && pz<DOG_Z && b.z>=DOG_Z){ b.passedDog=true; const d=S.dogBlocker;
    b.vz=-Math.abs(b.vz)*.28; b.vx=b.vx*.2+rand(-2,2); b.vy=Math.abs(b.vy)*.25+rand(2.5,4.5); b.ax=0;
    d.bark=1.4; sfx('save'); setTimeout(()=>sfx('bark'),80); buzz(25); resolve('dogblock'); return; }
  // a roaming dog in the way
  if(!S.outcome && b.vz>0){ const dd=dogHitsBall(b); if(dd){ b.passedDog=true; S.dogBlocker=dd;
    b.vz=-Math.abs(b.vz)*.25; b.vx=b.vx*.2+(b.x>=dd.x?1:-1)*rand(1,2.5); b.vy=Math.abs(b.vy)*.25+rand(1.5,3.5); b.ax=0;
    dd.bark=1.4; dd.state='sit'; dd.t=rand(1.8,2.8); dd.wp=[]; dd.guard=false; dd.speedNow=0;
    sfx('save'); setTimeout(()=>sfx('bark'),80); buzz(25); resolve('dogblock'); return; } }
  // keeper
  if(keeper && !b.passedK && pz<KEEPER_Z && b.z>=KEEPER_Z){ b.passedK=true;
    const pose=keeperPose(keeper,S.simT), sg=keeperSegs(keeper,pose);
    let d=distSeg(b.x,b.y,sg.fx,sg.fy,sg.hx,sg.hy);
    if(pose.dive<.5){ const ay=pose.y+.02*keeper.p.height; d=Math.min(d,distSeg(b.x,b.y,pose.x-.3*keeper.p.height,ay,pose.x+.3*keeper.p.height,ay)+.03); }
    if(d<sg.rad+BALL_R){ const tot=Math.hypot(b.vx,b.vy,b.vz);
      if(tot<18.5 && Math.hypot(b.x-pose.x,b.y-pose.y)<.5*keeper.p.height && Math.random()<.6){ b.held=keeper; b.vx=b.vy=b.vz=0; }
      else { b.vz=-Math.abs(b.vz)*rand(.22,.38); b.vx=b.vx*.25+(b.x>=pose.x?1:-1)*rand(1.5,4); b.vy=Math.abs(b.vy)*.3+rand(1.5,4.5); b.ax=0; }
      sfx('save'); buzz(25); resolve('save'); return; } }
  // goal line
  if(!b.crossed && pz<GOAL_Z && b.z>=GOAL_Z){ b.crossed=true;
    const ax=Math.abs(b.x), sgn=Math.sign(b.x)||1, dPost=ax-HW;
    const postHit=Math.abs(dPost)<BALL_R+POST_R && b.y<GOAL_H+POST_R;
    const barHit=!postHit && Math.abs(b.y-GOAL_H)<BALL_R+POST_R && ax<HW+POST_R;
    if(postHit){ sfx('post'); buzz([20,30,20]);
      if(dPost<-.02 && Math.random()<.55){ b.vx-=sgn*rand(2.5,4); b.vz*=.7; b.ax=0; b.inNet=true; resolve('postin'); }
      else { b.vz=-Math.abs(b.vz)*.5; b.vx+=sgn*rand(1.5,3.5); b.ax=0; resolve('post'); } }
    else if(barHit){ sfx('post'); buzz([20,30,20]);
      if(b.y<GOAL_H-.02 && Math.random()<.4){ b.vy=-Math.abs(b.vy)-3; b.vz*=.5; b.inNet=true; resolve('barin'); }
      else { b.vz=-Math.abs(b.vz)*.45; b.vy=(b.y>GOAL_H?1:-1)*Math.abs(b.vy)*.6+(b.y>GOAL_H?2:0); b.ax=0; resolve('bar'); } }
    else if(ax<HW && b.y<GOAL_H){ b.inNet=true; resolve('goal'); }
    else resolve(b.y>=GOAL_H?'over':'wide');
  }
  if(b.inNet){
    const back=GOAL_Z+netDepth(b.y)-BALL_R;
    if(b.z>back){ b.z=back; netHits.push({x:b.x,y:b.y,t:clock,a:clamp(Math.abs(b.vz)*.03,.12,.6)}); if(Math.abs(b.vz)>3) sfx('net'); b.vz=-Math.abs(b.vz)*.08; b.vx*=.3; b.vy*=.3; b.ax=0; }
    if(Math.abs(b.x)>HW-BALL_R){ b.x=Math.sign(b.x)*(HW-BALL_R); b.vx*=-.2; }
    if(b.y>GOAL_H-BALL_R){ b.y=GOAL_H-BALL_R; b.vy=-Math.abs(b.vy)*.2; }
    if(b.z<GOAL_Z+BALL_R && b.vz<0){ b.z=GOAL_Z+BALL_R; b.vz=0; }
  } else if(b.z>WALL_Z-BALL_R && pz<=WALL_Z-BALL_R){
    const topH = b.x<FENCE_X?WALL_H:FENCE_H;
    if(b.y<topH){ b.z=WALL_Z-BALL_R; b.vz=-Math.abs(b.vz)*.4; b.vx*=.6; b.ax=0; sfx('thud',Math.min(1,sp/18)); }
    else { b.overWall=true; if(S.outcome) S.outcome.wall=true; }
  }
  if(b.overWall && b.z>WALL_Z+.3) b.gone=true;
  // posts from behind / outside: crude side-net & frame bounce when ball goes behind goal outside net
  if(!b.inNet && b.crossed && b.z>GOAL_Z && b.z<GOAL_Z+netDepth(b.y) && Math.abs(b.x)<HW+.1 && b.y<GOAL_H+.05){ // hitting outside of net
    b.vz*=.3; b.vx=(Math.sign(b.x)||1)*Math.abs(b.vx)*.3;
  }
}

//  TURN FLOW
// =========================================================
function decided(){
  const a=S.res.A,b=S.res.B, ga=a.filter(Boolean).length, gb=b.filter(Boolean).length;
  if(S.mode==='target') return S.target.shots>=10?'A':null;
  if(!(a.length>=5&&b.length>=5)){ const remA=Math.max(0,5-a.length), remB=Math.max(0,5-b.length);
    if(ga+remA<gb) return 'B'; if(gb+remB<ga) return 'A'; return null; }
  if(a.length===b.length && ga!==gb) return ga>gb?'A':'B';
  return null;
}
function startMatch(){
  S.res={A:[],B:[]}; S.target={score:0,shots:0,streak:0,rings:[]}; shotsSinceDog=0; S.outcome=null; S.paused=false;
  showScreen('game'); $('hud').classList.remove('hidden'); updateHUD(); sfx('whistle');
  nextTurn(true);
}
function nextTurn(first){
  const w=decided(); if(w){ endMatch(w); return; }
  const side = S.mode==='target' ? 'A' : (S.res.A.length<=S.res.B.length?'A':'B');
  const prevSide=S.side; S.side=side; S.outcome=null; cue=null;
  if(S.mode==='cpu'){ side==='A' ? setupUserShot(S.A,S.B) : setupCpuShot(S.B,S.A); }
  else if(S.mode==='pnp'){
    const p = side==='A'?S.A:S.B;
    if(!first && prevSide!==side){ showPass(p, ()=>setupUserShot(p,S.K)); return; }
    if(first){ showPass(p, ()=>setupUserShot(p,S.K)); return; }
    setupUserShot(p,S.K);
  } else { newRings(); setupUserShot(S.A,S.K); }
}
function switchCam(c){ if(cam===c) return; const f=$('fade'); f.style.opacity=1; setTimeout(()=>{ cam=c; f.style.opacity=0; },180); }
function setupUserShot(sp,kp){
  switchCam(CAMS.shoot); resetDogs(); ball=newBall(); keeper=makeKeeper(kp,false); shooter=null; S.shooterP=sp; S.simT=0; S.ts=1;
  setPhase('banner'); updateHUD();
  const sub = S.mode==='target' ? `Ball ${S.target.shots+1} of 10` : S.mode==='pnp' ? `vs ${kp.name} in goal` : `${kp.name} is in goal`;
  banner(`${sp.name} shoots`, sub);
}
function setupCpuShot(sp,kp){
  switchCam(CAMS.keep); resetDogs(); ball=newBall(); keeper=makeKeeper(kp,true); S.shooterP=sp; S.simT=0; S.ts=1;
  const runDur=[1.25,1.05,.9][settings.diff];
  shooter={p:sp,sx:-1.7,sz:-3.2,ex:-.52,ez:-.45,runDur,kicked:false,plan:null};
  setPhase('banner'); updateHUD(); banner(`Save it, ${kp.name}!`, `${sp.name} steps up`);
}
function setPhase(p){ S.phase=p; S.phaseT=0;
  if(p==='aim' && S.hints.shoot<3 && store.get('hintShoot',0)<4){ showHint('<b>Swipe up</b> from the ball to shoot<br>Curve your swipe to <b>bend it</b> · swipe faster for <b>power</b>'); }
  if(p==='runup'){ S.simT=-shooter.runDur; if(store.get('hintKeep',0)<4) showHint(matchMedia('(pointer:fine)').matches?'<b>Click</b> where to dive — or keys <b>Q W E / A S D</b>':'<b>Tap</b> where you want to dive!<br>Wait for the kick — go early and they\'ll see it'); }
}
function endMatch(w){
  setPhase('end'); hideHint();
  setTimeout(()=>{ sfx('whistle3'); showResult(w); },700);
}

// ---------- user shot ----------
function finishSwipe(){
  const pts=swipe.pts; swipe=null; if(S.phase!=='aim'||pts.length<2) return;
  const a=pts[0], b=pts[pts.length-1], dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  if(len<H*.06 || dy>-H*.03) return;
  const sh=computeShot(pts); if(!sh) return;
  hideHint(); store.set('hintShoot',store.get('hintShoot',0)+1);
  const p=S.shooterP, A=p.accuracy/100;
  const sig=(.06+(1-A)*.5)*(.4+sh.power*.9);
  let tx=sh.tx+gauss()*sig, ty=Math.max(.12,sh.ty+gauss()*sig*.7);
  launch(tx,ty,sh.speed,sh.curl);
  S.lastShot=sh; afterKick(); kickInfo(sh);
  cpuKeeperReact(p);
}
function computeShot(pts){
  const a=pts[0], b=pts[pts.length-1], dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy); if(len<8) return null;
  // speed from the last ~200ms of the stroke
  let k=pts.length-1; while(k>0 && b.t-pts[k-1].t<200) k--;
  let pl=0; for(let i=k+1;i<pts.length;i++) pl+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  const dt=Math.max(35,b.t-pts[k].t), sp=(pl/H)/(dt/1000);
  const power=clamp((sp-.45)/2.3,0,1);
  // aim: swipe vector, amplified, projected onto goal plane
  const bs=proj(cam,0,BALL_R,0), bar=proj(cam,0,GOAL_H,GOAL_Z), gain=(bs.y-bar.y)/(.40*H);
  const T={x:bs.x+dx*gain, y:bs.y+dy*gain}, u=unproj(cam,T.x,T.y,GOAL_Z);
  // curl from bend of the stroke
  let mc=0; for(const q of pts){ const cr=(dx*(q.y-a.y)-dy*(q.x-a.x))/len; if(Math.abs(cr)>Math.abs(mc)) mc=cr; }
  const bend=mc/len, curlN=Math.abs(bend)<.035?0:clamp(-bend*3.4,-1,1);
  const p=S.shooterP;
  return {tx:u.x, ty:clamp(u.y,.12,5), power, speed:lerp(12,16+12*p.power/100,power), curl:curlN*11*p.curve/100, curlN};
}
function cpuKeeperReact(shooterP){
  const k=keeper, K=k.p.keeping/100, d=S.mode==='target'?0:settings.diff;
  const react=[.32,.24,.17][d]-.06*K+(shooterP.id==='rookie'?.08:0);
  const cr=predictCross(ball,KEEPER_Z), spd=Math.hypot(ball.vx,ball.vy,ball.vz);
  const read=[.12,.27,.42][d]*(.75+.3*K);
  let tx,ty;
  if(Math.random()<read){ const s=.12+Math.max(0,spd-15)*.028; tx=cr.x+gauss()*s; ty=cr.y+gauss()*s*.8; }
  else if(Math.random()<.2){ tx=rand(-.35,.35); ty=rand(.3,1.2); }
  else { const side=Math.random()<.5?-1:1; tx=side*rand(.7,1.7); ty=rand(.15,1.5); }
  planDive(k,tx,ty,react,.62-.2*K+[.14,0,-.04][d]);
}
function afterKick(){ abortSteal(); setPhase('flight'); S.simT=0; sfx('kick'); buzz(15); maybeDogBlock();
  const p=proj(cam,ball.x,0,ball.z); for(let i=0;i<10;i++) parts.push({x:p.x+rand(-8,8),y:p.y,vx:rand(-90,90),vy:rand(-260,-80),life:.6,max:.6,col:Math.random()<.5?'#5d8f2c':'#8fbf4a',size:rand(2,4),g:900}); }

// ---------- CPU shot ----------
function cpuShoot(){
  const p=shooter.p, P=p.power/100, A=p.accuracy/100, d=settings.diff;
  const side=Math.random()<.5?-1:1;
  let tx = Math.random()<.55+.12*d ? side*rand(.85,1.65) : rand(-.75,.75);
  let ty = Math.random()<.5 ? rand(.15,.6) : rand(.7,1.65);
  // keeper went early? punish it
  if(keeper.plan && keeper.plan.t0 < -.12 && Math.random()<[.35,.6,.85][d]){ const kx=keeper.plan.tx; tx = (kx>=0?-1:1)*rand(.9,1.6); }
  const speed=14+6*P+d*2.2+rand(0,2), sig=.1+(1-A)*.42;
  tx+=gauss()*sig; ty=Math.max(.12,ty+gauss()*sig*.7);
  launch(tx,ty,speed,rand(-3,3)*p.curve/100);
  shooter.kicked=true; afterKick();
  S.ts=[.5,.62,.78][d];
  if(d===0){ const c=predictCross(ball,KEEPER_Z); cue={x:c.x,y:c.y,t:clock}; }
}
function userDive(sx,sy){
  if(!keeper||!keeper.isUser||keeper.plan) return;
  if(!(S.phase==='runup'||S.phase==='flight')) return;
  const u=unproj(cam,sx,sy,KEEPER_Z);
  planDive(keeper,clamp(u.x,-3,3),clamp(u.y,.1,2.6),S.simT,.45-.12*keeper.p.keeping/100);
  hideHint(); store.set('hintKeep',store.get('hintKeep',0)+1); sfx('swoosh');
}

// ---------- outcome ----------
const MSG={dogscore:'DOG GOAL!',dogblock:'BLOCKED!',goal:'GOAL!',postin:'POST & IN!',barin:'OFF THE BAR & IN!',save:'SAVED!',post:'OFF THE POST!',bar:'CROSSBAR!',wide:'WIDE!',over:'OVER!',short:'SAVED!'};
function resolve(type){
  if(S.outcome) return;
  const scored = type==='goal'||type==='postin'||type==='barin';
  S.outcome={type,scored,t:clock}; setPhase('outcome');
  const userShooting = !(keeper&&keeper.isUser);
  let good = userShooting ? scored : !scored;
  if(S.mode==='pnp') good=scored;
  let title=MSG[type], sub='';
  if(S.mode==='target'){
    const T=S.target; T.shots++;
    if(scored){ T.streak++; let pts=100, hit=0; T.rings.forEach(r=>{ if(!r.hit && Math.hypot(ball.x-r.x,ball.y-r.y)<r.r+BALL_R*.5){ r.hit=true; hit++; } });
      pts+=hit*250; const bonus=(T.streak-1)*50; pts+=bonus; T.score+=pts;
      sub=`+${pts}` + (hit?` · 🎯 RING HIT!`:'') + (T.streak>1?` · 🔥 x${T.streak} streak`:''); if(hit) title='BULLSEYE!'; }
    else { T.streak=0; sub='Streak lost'; }
    S.res.A.push(scored);
  } else {
    S.res[S.side].push(scored);
    if(keeper.isUser && type==='save') title='WHAT A SAVE!';
    if(keeper.isUser && scored) title=type==='goal'?'HE SCORES':MSG[type];
    if(!keeper.isUser && !scored && type==='save') sub=`${keeper.p.name} denies ${S.shooterP.name}`;
    const p=S.res.A.length+S.res.B.length; if(Math.max(S.res.A.length,S.res.B.length)>5) sub=sub||'SUDDEN DEATH';
  }
if(type==='dogblock' && S.dogBlocker){ title=`${S.dogBlocker.name} blocks!`; sub='🐾 Good dog!'; good=true; }
  if(type==='dogscore' && S.dogScorer){ title=`${S.dogScorer.name} scores!`; sub='🐾 Too slow! Kick lost'; good=true; shake=.2; }
  toast(title,sub,good);
  if(scored){ shake=.35; dogZoomies(); setTimeout(()=>sfx('bark'),250); }
  if(good){ setTimeout(()=>sfx('cheer'),scored?80:0); confetti(scored?90:50); buzz([30,40,30]); } else setTimeout(()=>sfx('groan'),150);
  updateHUD();
}

// =========================================================
//  TARGET RINGS
// =========================================================
function newRings(){ const T=S.target; T.rings=[]; const n=S.target.shots<4?1:2;
  for(let i=0;i<n;i++){ let x,y,ok; let tries=0; do{ x=(Math.random()<.5?-1:1)*rand(.6,1.45); y=rand(.4,1.4); ok=T.rings.every(r=>Math.hypot(r.x-x,r.y-y)>.9); }while(!ok&&++tries<20);
    T.rings.push({x,y,r:.3,hit:false}); } }

// =========================================================
//  UPDATE
// =========================================================
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000); last=now;
  if(S.paused) { render(); return; }
  clock+=dt; S.phaseT+=dt;
  // time scale eases back after outcome
  if(S.phase==='outcome') S.ts=lerp(S.ts,1,Math.min(1,dt*3));
  const sdt=dt*S.ts;
  switch(S.phase){
    case 'banner': if(S.phaseT>1.15) setPhase(shooter?'runup':'aim'); break;
    case 'aim': if(!swipe && !S.stealDog && S.phaseT>STALL_T && keeper && !keeper.isUser) startSteal(); updateSteal(dt); break;
    case 'dogsteal': S.simT+=dt; updateSteal(dt); break;
    case 'runup': {
      S.simT+=sdt;
      if(S.simT>=0 && !shooter.kicked){ S.simT=0; cpuShoot(); }
      break; }
    case 'flight': case 'outcome': case 'end': {
      const steps=Math.ceil(sdt/(1/240)), h=sdt/steps;
      for(let i=0;i<steps;i++){ S.simT+=h; stepBall(h); }
      if(S.phase==='flight' && (S.simT>3 || (ball.flying && Math.hypot(ball.vx,ball.vz)<.4 && ball.y<BALL_R+.01 && S.simT>.6))) resolve('short');
      if(S.phase==='outcome' && S.phaseT>2.1) nextTurn();
      break; }
  }
  if(ball && ball.flying){ ball.hist.push({x:ball.x,y:ball.y,z:ball.z}); if(ball.hist.length>14) ball.hist.shift(); }
  // particles
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.life-=dt; if(q.life<=0){ parts.splice(i,1); continue; }
    q.vy+=(q.g||0)*dt; q.vx*=q.drag?1-q.drag*dt:1; q.x+=q.vx*dt; q.y+=q.vy*dt; if(q.vr) q.rot+=q.vr*dt; }
  for(let i=trail.length-1;i>=0;i--) if(now-trail[i].t>260) trail.splice(i,1);
  netHits=netHits.filter(n=>clock-n.t<1.6);
  shake=Math.max(0,shake-dt); updateDogs(dt*S.ts); rollIn(dt);
  render();
}

// =========================================================
//  RENDER
// =========================================================
function render(){
  const g=ctx; g.setTransform(DPR,0,0,DPR,0,0);
  const key=cam===CAMS.shoot?'s':'k'; if(!bgCache[key]) bgCache[key]=buildBG(cam);
  g.save();
  if(shake>0){ const m=shake*14; g.translate(rand(-m,m),rand(-m,m)); }
  g.drawImage(bgCache[key],0,0,W,H);
  const items=[];
  DOGS.forEach(d=>items.push({z:dogPos(d).z,f:()=>drawDog(g,d)}));
  items.push({z:GOAL_Z+NET_D0,f:()=>drawGoalBack(g)});
  items.push({z:GOAL_Z-.001,f:()=>drawGoalFront(g)});
  if(S.mode==='target' && S.screen==='game') items.push({z:GOAL_Z-.01,f:()=>drawRings(g)});
  if(keeper) items.push({z:KEEPER_Z,f:()=>drawKeeper(g)});
  else if(S.screen!=='game') items.push({z:KEEPER_Z,f:()=>drawKeeper(g)});
  if(ball && !ball.gone) items.push({z:ball.held?KEEPER_Z-.2:ball.z,f:()=>drawBall(g)});
  if(shooter) items.push({z:shooterPos().z,f:()=>drawShooter(g)});
  items.sort((a,b)=>b.z-a.z).forEach(it=>it.f());
  if(cue && S.phase!=='outcome') drawCue(g);
  if(swipe && settings.aim && S.phase==='aim') drawAimGuide(g);
  drawTrail(g);
  g.restore();
  drawParts(g);
}

function drawGoalBack(g){
  const c=cam, P=(x,y,z)=>proj(c,x,y,z);
  // ground shadow
  const s1=P(-HW,0,GOAL_Z),s2=P(HW,0,GOAL_Z),s3=P(HW+.25,0,GOAL_Z+NET_D0+.15),s4=P(-HW+.25,0,GOAL_Z+NET_D0+.15);
  g.fillStyle='rgba(10,40,0,.22)'; g.beginPath(); g.moveTo(s1.x,s1.y); g.lineTo(s2.x,s2.y); g.lineTo(s3.x,s3.y); g.lineTo(s4.x,s4.y); g.fill();
  const bulge=(x,y)=>{ let d=0; for(const n of netHits){ const age=clock-n.t, e=age<.08?age/.08:Math.exp(-(age-.08)*4)*Math.cos((age-.08)*15); d+=n.a*e*Math.exp(-((x-n.x)**2+(y-n.y)**2)/.3);} return d; };
  const BP=(x,y)=>P(x,y,GOAL_Z+netDepth(y)+bulge(x,y));
  // back frame
  const fw=Math.max(1.5,POST_R*1.6*P(0,0,GOAL_Z+NET_D0).s);
  g.lineCap='round'; g.strokeStyle='#d9dde3'; g.lineWidth=fw;
  const line=(pts)=>{ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.stroke(); };
  line([P(-HW,0,GOAL_Z+NET_D0),P(HW,0,GOAL_Z+NET_D0)]);
  [-HW,HW].forEach(x=>{ line([P(x,0,GOAL_Z),P(x,0,GOAL_Z+NET_D0),P(x,GOAL_H,GOAL_Z+NET_D1)]); line([P(x,GOAL_H,GOAL_Z),P(x,GOAL_H,GOAL_Z+NET_D1)]); });
  line([P(-HW,GOAL_H,GOAL_Z+NET_D1),P(HW,GOAL_H,GOAL_Z+NET_D1)]);
  // net
  const ns=P(0,0,GOAL_Z+1).s; g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=Math.max(.6,.011*ns);
  const NX=20, NY=12;
  for(let i=0;i<=NX;i++){ const x=-HW+GOAL_W*i/NX; g.beginPath(); for(let j=0;j<=8;j++){ const p=BP(x,GOAL_H*j/8); j?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);} g.stroke(); }
  for(let j=0;j<=NY;j++){ const y=GOAL_H*j/NY; g.beginPath(); for(let i=0;i<=NX;i++){ const p=BP(-HW+GOAL_W*i/NX,y); i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);} g.stroke(); }
  // side + top nets
  [-HW,HW].forEach(x=>{ for(let j=0;j<=NY;j++){ const y=GOAL_H*j/NY; line([P(x,y,GOAL_Z),P(x,y,GOAL_Z+netDepth(y))]); }
    for(let i=1;i<=5;i++){ g.beginPath(); for(let j=0;j<=6;j++){ const y=GOAL_H*j/6, p=P(x,y,GOAL_Z+netDepth(y)*i/6); j?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);} g.stroke(); } });
  for(let i=0;i<=NX;i+=2){ const x=-HW+GOAL_W*i/NX; line([P(x,GOAL_H,GOAL_Z),P(x,GOAL_H,GOAL_Z+NET_D1)]); }
  for(let i=1;i<=3;i++) line([P(-HW,GOAL_H,GOAL_Z+NET_D1*i/4),P(HW,GOAL_H,GOAL_Z+NET_D1*i/4)]);
}
function drawGoalFront(g){

function drawRings(g){

// ---------- ball ----------
const ICO=(()=>{ const f=1.618, v=[[0,1,f],[0,-1,f],[0,1,-f],[0,-1,-f],[1,f,0],[-1,f,0],[1,-f,0],[-1,-f,0],[f,0,1],[-f,0,1],[f,0,-1],[-f,0,-1]];
  return v.map(([x,y,z])=>{ const l=Math.hypot(x,y,z); return [x/l,y/l,z/l]; }); })();
function drawBall(g){
  const b=ball, p=proj(cam,b.x,b.y,b.z), r=BALL_R*p.s;
  // shadow
  const sp=proj(cam,b.x,0,b.z), k=1/(1+b.y*.6);
  g.fillStyle=`rgba(0,25,0,${.38*k})`; g.beginPath(); g.ellipse(sp.x,sp.y,r*1.15*k+1,r*.38*k+.5,0,0,7); g.fill();

    for(let i=1;i<b.hist.length;i++){ const a=proj(cam,b.hist[i-1].x,b.hist[i-1].y,b.hist[i-1].z), c=proj(cam,b.hist[i].x,b.hist[i].y,b.hist[i].z);
      g.strokeStyle=`rgba(255,255,255,${.35*i/b.hist.length})`; g.lineWidth=BALL_R*c.s*1.4*i/b.hist.length; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(c.x,c.y); g.stroke(); } }
  g.save(); g.beginPath(); g.arc(p.x,p.y,r,0,7); g.clip();
  g.fillStyle='#f7f7f5'; g.fillRect(p.x-r,p.y-r,2*r,2*r);
  const cx=Math.cos(b.rx),sx=Math.sin(b.rx),cy=Math.cos(b.ry),sy=Math.sin(b.ry);
  ICO.forEach(([x,y,z],i)=>{ let y1=y*cx-z*sx, z1=y*sx+z*cx; let x2=x*cy+z1*sy, z2=-x*sy+z1*cy; if(z2>.15) return;
    const fs=Math.max(.05,-z2), px=p.x+x2*r, py=p.y-y1*r, ang=Math.atan2(-y1,x2);
    g.fillStyle=i%3===0?'#1b2258':'#ff6a17'; g.beginPath(); g.ellipse(px,py,r*.36*Math.sqrt(fs)+.3,r*.36,ang,0,7); g.fill(); });
  const sh=g.createRadialGradient(p.x-r*.35,p.y-r*.4,r*.1,p.x,p.y,r*1.05); sh.addColorStop(0,'rgba(255,255,255,.55)'); sh.addColorStop(.55,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(0,0,40,.35)');
  g.fillStyle=sh; g.fillRect(p.x-r,p.y-r,2*r,2*r); g.restore();
  g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=1; g.beginPath(); g.arc(p.x,p.y,r,0,7); g.stroke();
}

// ---------- kids ----------
function limb(g,x1,y1,x2,y2,x3,y3,w,c1,c2,split){

  g.strokeStyle=c2||c1; g.beginPath(); g.moveTo(x2,y2); g.lineTo(x3,y3); g.stroke();

function drawFace(g,p,x,y,r){

  const img=faceImg[p.id], S2=r*2.4;

  else { g.fillStyle=p.skin; g.beginPath(); g.arc(x,y-r,r,0,7); g.fill(); }
}
function drawKidFront(g,p,cx,cy,sc,pose){
  const h=p.height*sc, X=u=>u*h, Y=u=>-(u-.5)*h, sp=pose.spread||0, cr=pose.crouch||0;
  g.save(); g.translate(cx,cy); g.rotate(pose.a); g.lineCap='round'; g.lineJoin='round';
  const hip=.37-cr*.05, knee=.2-cr*.03;
  // legs
  [-1,1].forEach(s=>{ const kx=s*(.085+cr*.05+sp*.4), fx=s*(.1+cr*.04+sp*.9);
    limb(g,X(s*.06),Y(hip),X(kx),Y(knee),X(fx),Y(.04),.085*h,p.skin,p.socks);
    g.strokeStyle=p.socks; g.lineWidth=.09*h; g.beginPath(); g.moveTo(X(lerp(kx,fx,.25)),Y(lerp(knee,.04,.25))); g.lineTo(X(fx),Y(.05)); g.stroke();
    g.fillStyle=p.shoes; g.beginPath(); g.ellipse(X(fx+s*.015),Y(.02),.065*h,.035*h,0,0,7); g.fill(); });
  // shorts

  // arms (behind torso if low)
  const handFor=s=>{ const rd=[s*.27,.4], upP=[s*.32,.82], ov=[s*.1,1.04]; const m=[lerp(rd[0],upP[0],pose.arms),lerp(rd[1],upP[1],pose.arms)]; return [lerp(m[0],ov[0],pose.dive),lerp(m[1],ov[1],pose.dive)]; };
  const drawArm=s=>{ const sh=[s*.14,.6], hd=handFor(s), el=[(sh[0]+hd[0])/2+s*.06*(1-pose.dive),(sh[1]+hd[1])/2];
    limb(g,X(sh[0]),Y(sh[1]),X(el[0]),Y(el[1]),X(hd[0]),Y(hd[1]),.07*h,p.shirt,p.skin);
    g.fillStyle='#f4f6f2'; g.beginPath(); g.arc(X(hd[0]),Y(hd[1]),.058*h,0,7); g.fill(); g.fillStyle='#2fc46a'; g.beginPath(); g.arc(X(hd[0]),Y(hd[1]),.03*h,0,7); g.fill(); };
  // torso
  g.fillStyle=p.shirt; g.beginPath(); g.moveTo(X(-.15),Y(.39)); g.lineTo(X(-.165),Y(.58)); g.quadraticCurveTo(X(-.165),Y(.635),X(-.1),Y(.64)); g.lineTo(X(.1),Y(.64));
  g.quadraticCurveTo(X(.165),Y(.635),X(.165),Y(.58)); g.lineTo(X(.15),Y(.39)); g.closePath(); g.fill();
  g.fillStyle=p.shirt2; g.globalAlpha=.55; for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(X(-.15+i*.11),Y(.62)); g.lineTo(X(-.1+i*.11),Y(.62)); g.lineTo(X(-.14+i*.11),Y(.4)); g.lineTo(X(-.17+i*.11),Y(.4)); g.fill(); } g.globalAlpha=1;
  drawArm(-1); drawArm(1);
  // neck (shadowed skin), then the photo head with its chin on the collar line, then the collar over the join
  g.fillStyle=p.neck; g.beginPath(); g.moveTo(X(-.042),Y(.7)); g.lineTo(X(.042),Y(.7)); g.lineTo(X(.05),Y(.615)); g.lineTo(X(-.05),Y(.615)); g.closePath(); g.fill();
  drawFace(g,p,X(0),Y(.66),p.headR*h);
  g.strokeStyle=p.collar; g.lineWidth=Math.max(1,.024*h); g.beginPath(); g.ellipse(X(0),Y(.632),.068*h,.026*h,0,0,Math.PI); g.stroke();
  g.strokeStyle=p.shirt; g.lineWidth=Math.max(1,.018*h); g.beginPath(); g.moveTo(X(-.1),Y(.638)); g.lineTo(X(-.066),Y(.636)); g.moveTo(X(.066),Y(.636)); g.lineTo(X(.1),Y(.638)); g.stroke();
  g.restore();
}
function drawKidBack(g,p,fx,fy,sc,anim){
  const h=p.height*sc, X=u=>fx+u*h, Y=u=>fy-u*h, ph=anim.ph||0, run=anim.run||0, kick=anim.kick||0, lean=anim.lean||0;
  g.save(); g.lineCap='round'; g.lineJoin='round';
  g.fillStyle='rgba(0,25,0,.3)'; g.beginPath(); g.ellipse(fx,fy,.28*h,.06*h,0,0,7); g.fill();
  g.translate(fx,fy); g.rotate(lean); g.translate(-fx,-fy);
  // legs: left/right from behind; right leg is kicking leg
  [-1,1].forEach(s=>{ let lift=run*Math.max(0,Math.sin(ph+(s>0?0:Math.PI)))*.14, fxo=s*.1, fyo=.03+lift;
    if(s>0 && kick>0){ const k=Math.sin(Math.min(1,kick)*Math.PI*.9); fxo=lerp(.1,.04,k); fyo=.03+k*.22; }
    const kx=s*.09, ky=.2+lift*.6;
    limb(g,X(s*.06),Y(.37),X(kx),Y(ky),X(fxo),Y(fyo),.085*h,p.skin,p.socks);
    g.fillStyle=p.shoes; g.beginPath(); g.ellipse(X(fxo),Y(fyo-.015),.05*h,.035*h,0,0,7); g.fill(); });
  g.fillStyle=p.shorts; g.beginPath(); g.moveTo(X(-.15),Y(.43)); g.lineTo(X(.15),Y(.43)); g.lineTo(X(.17),Y(.25)); g.lineTo(X(-.17),Y(.25)); g.closePath(); g.fill();
  // arms

  // torso + number
  g.fillStyle=p.shirt; g.beginPath(); g.moveTo(X(-.16),Y(.64)); g.lineTo(X(.16),Y(.64)); g.lineTo(X(.14),Y(.39)); g.lineTo(X(-.14),Y(.39)); g.closePath(); g.fill();
  g.fillStyle=p.shirt===('#ffd21f')?'#1f4fd1':'#ffd23f'; g.textAlign='center'; g.textBaseline='middle';
  g.font=`900 ${Math.round(.15*h)}px system-ui,sans-serif`; g.fillText(String(p.num),X(0),Y(.48));
  if(h>140){ g.font=`900 ${Math.round(.045*h)}px system-ui,sans-serif`; g.fillText(p.name.toUpperCase(),X(0),Y(.58)); }
  // head (back): hair
  g.fillStyle=p.skin; g.fillRect(X(-.04),Y(.67),.08*h,.06*h);
  const hr=p.headR*h; g.fillStyle=p.skin; [-1,1].forEach(s=>{ g.beginPath(); g.ellipse(X(s*p.headR*.98),Y(.78),hr*.16,hr*.24,0,0,7); g.fill(); });
  g.fillStyle=p.hair; g.beginPath(); g.arc(X(0),Y(.8),hr,0,7); g.fill();
  g.strokeStyle=p.hair2; g.lineWidth=Math.max(1,hr*.08); for(let i=-2;i<=2;i++){ g.beginPath(); g.moveTo(X(0),Y(.8)-hr*.9); g.quadraticCurveTo(X(i*.04),Y(.8),X(i*.07),Y(.8)+hr*.85); g.stroke(); }
  g.restore();
}
function drawKeeper(g){
  const k=keeper || titleKeeper; if(!k) return;
  const pose=keeperPose(k,S.simT), p=proj(cam,pose.x,pose.y,KEEPER_Z), gp=proj(cam,pose.x,0,KEEPER_Z);
  const h=k.p.height*gp.s;
  g.fillStyle='rgba(0,25,0,.3)'; g.beginPath(); g.ellipse(gp.x,gp.y,(.3+Math.abs(Math.sin(pose.a))*.45)*h,.07*h,0,0,7); g.fill();
  let pz=pose; if(S.outcome && S.outcome.t && keeper && !keeper.plan){}
  // celebrate / slump after outcome
  if(S.phase==='outcome' && keeper && (!keeper.plan || keeperPoseDone())){
    const good = keeper.isUser ? !S.outcome.scored : !S.outcome.scored;
    if(!S.outcome.scored && !keeper.plan){ pz=Object.assign({},pose,{arms:1,dive:0,y:pose.y+Math.abs(Math.sin(clock*9))*.08}); }
  }
  drawKidFront(g,k.p,p.x,p.y,gp.s,pz);
}
function keeperPoseDone(){ const pl=keeper.plan; return pl && S.simT>pl.t0+pl.Td+.5; }
function shooterPos(){ const s=shooter; const runEnd=-.12;
  if(S.phase==='banner') return {x:s.sx,z:s.sz,u:0};
  const u=clamp((S.simT+s.runDur)/(s.runDur+runEnd),0,1); return {x:lerp(s.sx,s.ex,u),z:lerp(s.sz,s.ez,u),u}; }
function drawShooter(g){
  const s=shooter, pos=shooterPos(), p=proj(cam,pos.x,0,pos.z);
  const running=S.phase==='runup' && pos.u<1, kickT=S.phase==='runup'&&pos.u>=1 ? (S.simT+.12)/.12*.6 : (s.kicked? Math.min(1.6,.6+S.simT*3):0);
  const anim={ph:clock*14, run:running?1:0, kick:clamp(kickT,0,1.2), lean:running?.06:(s.kicked?-.08:0)};
  if(S.phase==='outcome' && S.outcome.scored){ anim.run=0; anim.kick=0; anim.lean=Math.sin(clock*10)*.08; }
  g.save(); if(s.kicked) g.globalAlpha=.85; drawKidBack(g,s.p,p.x,p.y,p.s,anim); g.restore();

let titleKeeper=null;

// ---------- dogs (Vixen & Izzy) ----------
// They roam the whole yard (in front of the goal too): walk, trot, sniff, sit, chase each other, and sometimes
// park in the shooting lane as an obstacle. A dog in the ball's path blocks it. If the shooter stalls, one steals the ball
// and noses it into the goal.
// Goal frame + net is a keep-out box, padded by the dog's body length so no part of her clips the netting.
function goalRect(d){ const m=.18+.48*(d?d.size:1.3); return {x0:-HW-m, x1:HW+m, z0:GOAL_Z-.32, z1:GOAL_Z+NET_D0+.3}; }
const inRect=(r,x,z)=>x>r.x0&&x<r.x1&&z>r.z0&&z<r.z1;

function dogZoomies(){ DOGS.forEach(d=>{ if(d.plan||STEAL_STATES[d.state]) return; d.state='flee'; d.speed=5.2; routeTo(d,randWp()); routeMore(d,randWp()); d.bark=1; }); }

    if(!DOG_MOVING[d.state]){ d.t-=dt; d.speedNow=0; if(d.t<=0) dogAction(d); return; }
    let tg;
    if(d.state==='chase'){
      d.t-=dt; const o=d.target;
      if(d.t<=0 || o.plan || !DOG_MOVING[o.state] || STEAL_STATES[o.state]){ d.state='sniff'; d.t=rand(1,2); if(o.state==='flee'&&!o.plan){ o.state='sit'; o.t=rand(1.5,3); o.wp=[]; } return; }

    } else tg=d.wp[0];

    const dx=tg.x-d.x, dz=tg.z-d.z, dist=Math.hypot(dx,dz), step=d.speed*dt;

function resetDogs(){

    else if(STEAL_STATES[d.state]){ d.state='sniff'; d.t=rand(1,2); }
    if(d.z<2.4 && !d.plan){ d.state='trot'; d.speed=3.2; routeTo(d,randWp()); } });   // never start a kick with a dog on the ball
  S.dogBlocker=null; S.stealDog=null; S.dogScorer=null; S.steal=null;
}

// ---- a dog standing in the ball's path blocks it ----
function dogBody(d){ const s=d.size;
  if(d.state==='sit') return {cx:d.x+.03*s, hx:.21*s, hz:.17*s, ht:.72*s};
  return {cx:d.x+(d.dir||1)*.08*s, hx:.38*s, hz:.13*s, ht:.62*s}; }
function dogHitsBall(b){
  for(const d of DOGS){ if(d.plan || STEAL_STATES[d.state] || d===S.dogBlocker) continue;
    if(d.z<1.6 || d.z>GOAL_Z-.12) continue;
    const q=dogBody(d);
    if(Math.abs(b.x-q.cx)<q.hx+BALL_R && Math.abs(b.z-d.z)<q.hz+BALL_R && b.y-BALL_R<q.ht) return d; }
  return null;
}

// ---- stall too long and a dog takes the ball ----
const STALL_T=6;
function startSteal(){
  const free=DOGS.filter(d=>!d.plan); if(!free.length) return;

  const dir=Math.random()<.5?-1:1, push=pushSpot(d,dir);
  d.state='steal'; d.speed=5.2; d.bark=1.2; d.guard=false; d.target=null; d.stealDir=dir; d.wp=[];

function pushSpot(d,dir){ return {x:ball.x-dir*.45*d.size, z:ball.z-.12}; }
// after the dog scores, the ball trickles on into the net

  b.x+=st.ux*st.spd*dt; b.z+=st.uz*st.spd*dt; b.rx+=st.spd*dt/BALL_R;

      const tx=d.stealDir*rand(.75,1.3); S.steal={tx,tz:GOAL_Z+.8,spd:0};

DOGS.forEach((d,i)=>{ Object.assign(d,{x:d.hx,z:d.hz,state:'sit',t:rand(1,3)+i*1.5,dir:d.hx<0?1:-1,wp:[],gait:0,speedNow:0,target:null,guard:false}); });

  const order=DOGS.filter(q=>!STEAL_STATES[q.state] && segClear(goalRect(q),q,{x:c.x,z:DOG_Z})).sort((a,b)=>Math.hypot(a.x-c.x,a.z-DOG_Z)-Math.hypot(b.x-c.x,b.z-DOG_Z)); if(!order.length) return; const d=order[Math.random()<.75||order.length<2?0:1];

function drawTrail(g){

}

  for(let i=1;i<=12;i++){ const t=T*i/12, x=v.x*t+.5*sh.curl*t*t, y=Math.max(BALL_R,BALL_R+v.y*t-.5*G*t*t), z=v.z*t, p=proj(cam,x,y,z);
    g.beginPath(); g.arc(p.x,p.y,Math.max(1.5,.035*p.s),0,7); g.fill(); }
  const tp=proj(cam,sh.tx,sh.ty,GOAL_Z), r=.2*tp.s; g.strokeStyle='rgba(255,210,63,.95)'; g.lineWidth=2.5;
  g.beginPath(); g.arc(tp.x,tp.y,r,0,7); g.stroke(); g.beginPath(); g.moveTo(tp.x-r*1.5,tp.y); g.lineTo(tp.x+r*1.5,tp.y); g.moveTo(tp.x,tp.y-r*1.5); g.lineTo(tp.x,tp.y+r*1.5); g.stroke();
}
function confetti(n){ const cols=['#ffd23f','#ff4d5e','#2fc46a','#36a3ff','#ffffff','#ff8a1f'];
  for(let i=0;i<n;i++) parts.push({x:rand(0,W),y:rand(-H*.3,-10),vx:rand(-60,60),vy:rand(80,260),life:rand(1.8,3),max:3,col:cols[i%cols.length],size:rand(5,10),rot:rand(0,6),vr:rand(-8,8),conf:true,g:60,drag:.4}); }
function drawParts(g){ parts.forEach(q=>{ g.globalAlpha=Math.min(1,q.life/(q.max*.4)); g.fillStyle=q.col;
  if(q.conf){ g.save(); g.translate(q.x,q.y); g.rotate(q.rot); g.fillRect(-q.size/2,-q.size/4,q.size,q.size/2*Math.abs(Math.cos(q.rot*1.3))+1); g.restore(); }
  else { g.beginPath(); g.arc(q.x,q.y,q.size,0,7); g.fill(); } }); g.globalAlpha=1; }

// =========================================================
//  INPUT
// =========================================================
cv.addEventListener('pointerdown',e=>{
  audioInit(); if(S.screen!=='game'||S.paused) return; e.preventDefault();
  if(S.phase==='aim'){ swipe={id:e.pointerId,pts:[{x:e.clientX,y:e.clientY,t:performance.now()}]}; try{cv.setPointerCapture(e.pointerId);}catch(_){} trail.length=0; trail.push({x:e.clientX,y:e.clientY,t:performance.now()}); }
  else if(keeper && keeper.isUser) userDive(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{ if(!swipe||e.pointerId!==swipe.id) return; let ev=e.getCoalescedEvents?e.getCoalescedEvents():null; if(!ev||!ev.length) ev=[e];
  for(const q of ev){ const pt={x:q.clientX,y:q.clientY,t:performance.now()}; swipe.pts.push(pt); trail.push(pt); }
  if(swipe.pts.length>200) swipe.pts.splice(1,swipe.pts.length-200); });
const endSwipe=e=>{ if(!swipe||e.pointerId!==swipe.id) return; finishSwipe(); };
cv.addEventListener('pointerup',endSwipe); cv.addEventListener('pointercancel',e=>{ if(swipe&&e.pointerId===swipe.id) swipe=null; });
window.addEventListener('keydown',e=>{
  if(e.key==='Escape' && S.screen==='game'){ togglePause(); return; }
  if(S.screen!=='game'||S.paused||!keeper||!keeper.isUser) return;
  const map={q:[-1.5,1.45],w:[0,1.65],e:[1.5,1.45],a:[-1.55,.3],s:[0,.45],d:[1.55,.3]}; const m=map[e.key.toLowerCase()];
  if(m && !keeper.plan && (S.phase==='runup'||S.phase==='flight')){ planDive(keeper,m[0],m[1],S.simT,.45-.12*keeper.p.keeping/100); hideHint(); sfx('swoosh'); }
});

// =========================================================
//  UI
// =========================================================
const screens=['scTitle','scSelect','scPass','scPause','scSettings','scResult'];
function showScreen(name){ S.screen=name; const map={title:'scTitle',select:'scSelect',pass:'scPass',settings:'scSettings',result:'scResult'};
  screens.forEach(id=>$(id).classList.toggle('hidden',map[name]!==id)); if(name!=='game'&&name!=='pass') $('hud').classList.add('hidden'); }
function bg(el,p){ el.style.backgroundImage=`url(${FACES[p.id]})`; }
function banner(a,b){ $('bn1').textContent=a; $('bn2').textContent=b||''; const el=$('banner'); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function toast(a,b,good){ $('ts1').textContent=a; $('ts2').textContent=b||''; $('ts2').style.display=b?'inline-block':'none'; const el=$('toast'); el.className=''; void el.offsetWidth; el.className='show '+(good?'good':'bad'); }
function showHint(h){ const el=$('hint'); el.innerHTML=h; el.classList.remove('hidden'); el.style.opacity=1; }
function hideHint(){ const el=$('hint'); el.style.opacity=0; setTimeout(()=>{ if(el.style.opacity==='0') el.classList.add('hidden'); },300); }
function kickInfo(sh){ const el=$('kickInfo'); const pw=Math.round(sh.power*100); const bars='▮'.repeat(Math.round(sh.power*5)).padEnd(5,'▯');
  el.textContent=`⚡ Power ${bars} ${pw}%` + (sh.curlN? `  ·  ${sh.curlN>0?'↷':'↶'} Curl ${Math.round(Math.abs(sh.curlN)*100)}%`:''); el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1600); }

function updateHUD(){
  const tA=$('tA'), tB=$('tB');
  if(S.mode==='target'){
    bg($('tApf'),S.A); $('tAnm').textContent=S.A.name; $('tAg').textContent=S.target.score;
    $('tBpf').style.backgroundImage='none'; $('tBpf').textContent='🎯'; $('tBpf').style.cssText+='display:flex;align-items:center;justify-content:center;font-size:20px;background:#ffd23f';
    $('tBnm').textContent='BEST'; $('tBg').textContent=store.get('best_'+S.A.id,0); $('tBd').innerHTML='';
    $('tAd').innerHTML=Array.from({length:10},(_,i)=>`<div class="dot ${i<S.res.A.length?(S.res.A[i]?'g':'m'):(i===S.res.A.length?'now':'')}"></div>`).join('');
    $('midLbl').textContent=S.target.streak>1?`🔥 STREAK x${S.target.streak}`:`BALL ${Math.min(10,S.target.shots+1)} / 10`;
    tA.classList.add('on'); tB.classList.remove('on'); return;
  }
  $('tBpf').textContent=''; $('tBpf').style.cssText='';
  bg($('tApf'),S.A); bg($('tBpf'),S.B);
  $('tAnm').textContent=S.A.name; $('tBnm').textContent=S.B.name;
  const dots=(arr,active)=>{ const n=Math.max(5,arr.length+(active?1:0)); let s=''; for(let i=0;i<n;i++) s+=`<div class="dot ${i<arr.length?(arr[i]?'g':'m'):(active&&i===arr.length?'now':'')}"></div>`; return s; };
  const actA=S.side==='A'&&!S.outcome, actB=S.side==='B'&&!S.outcome;
  $('tAd').innerHTML=dots(S.res.A,actA); $('tBd').innerHTML=dots(S.res.B,actB);
  $('tAg').textContent=S.res.A.filter(Boolean).length; $('tBg').textContent=S.res.B.filter(Boolean).length;
  tA.classList.toggle('on',S.side==='A'); tB.classList.toggle('on',S.side==='B');
  const round=Math.max(1, S.outcome ? Math.max(S.res.A.length,S.res.B.length) : (S.side==='A'?S.res.A.length:S.res.B.length)+1);
  $('midLbl').textContent = round>5 ? `SUDDEN DEATH · ROUND ${round}` : `ROUND ${round} OF 5`;
}

// ---- select screen ----
let sel={me:null, opp:'rnd', p1:null, p2:null};
function openSelect(mode){
  S.mode=mode; showScreen('select');
  $('selSub').textContent={cpu:'Shootout vs CPU',pnp:'Pass & Play',target:'Target Challenge'}[mode];
  $('selTitle').textContent=mode==='pnp'?'Pick 2 shooters':'Choose your player';
  $('oppLbl').classList.toggle('hidden',mode!=='cpu'); $('opps').classList.toggle('hidden',mode!=='cpu');
  $('diffLbl').classList.toggle('hidden',mode==='target'); $('diffSeg').classList.toggle('hidden',mode==='target');
  sel={me:store.get('lastMe','ace'), opp:'rnd', p1:null, p2:null};
  renderCards();
}
function renderCards(){
  const c=$('cards'); c.innerHTML='';
  PLAYERS.forEach(p=>{
    const d=document.createElement('div'); d.className='card';
    let badge='';
    if(S.mode==='pnp'){ if(sel.p1===p.id) {d.classList.add('sel'); badge='<div class="badge">PLAYER 1</div>';} else if(sel.p2===p.id){ d.classList.add('sel'); badge='<div class="badge">PLAYER 2</div>'; }
      else if(sel.p1&&sel.p2) badge='<div class="badge k">🧤 KEEPER</div>'; }
    else if(sel.me===p.id){ d.classList.add('sel'); badge='<div class="badge">YOU</div>'; }
    const st=(l,v)=>`<div class="stat"><b>${l}</b><i><u style="width:${v}%"></u></i></div>`;
    d.innerHTML=`${badge}<div class="face" style="background-image:url(${FACES[p.id]})"></div><div class="nm"><span>${esc(p.name)} <small style="opacity:.55">#${p.num}</small></span><button class="edit" aria-label="Rename">✏️</button></div>
      <div class="trait">${p.trait}</div>${st('Power',p.power)}${st('Accuracy',p.accuracy)}${st('Curve',p.curve)}${st('Keeping',p.keeping)}`;
    d.onclick=e=>{ sfx('click');
      if(e.target.closest('.edit')){ openName(p); return; }
      if(S.mode==='pnp'){ if(sel.p1===p.id) sel.p1=null; else if(sel.p2===p.id) sel.p2=null; else if(!sel.p1) sel.p1=p.id; else if(!sel.p2) sel.p2=p.id; else sel.p2=p.id; }
      else { sel.me=p.id; if(sel.opp===p.id) sel.opp='rnd'; }
      renderCards(); };
    c.appendChild(d);
  });
  // opponents
  const o=$('opps'); o.innerHTML='';
  const r=document.createElement('div'); r.className='opp rnd'+(sel.opp==='rnd'?' sel':''); r.textContent='?'; r.onclick=()=>{sel.opp='rnd'; sfx('click'); renderCards();}; o.appendChild(r);
  PLAYERS.forEach(p=>{ const d=document.createElement('div'); d.className='opp'+(sel.opp===p.id?' sel':'')+(sel.me===p.id?' dis':''); bg(d,p); d.title=p.name; d.onclick=()=>{ sel.opp=p.id; sfx('click'); renderCards(); }; o.appendChild(d); });
  $('btnStart').disabled = S.mode==='pnp' && !(sel.p1&&sel.p2);
  $('btnStart').style.opacity = $('btnStart').disabled?.5:1;
  syncSeg();
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function syncSeg(){ ['diffSeg','diffSeg2'].forEach(id=>$(id).querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.d===settings.diff))); }
['diffSeg','diffSeg2'].forEach(id=>$(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; settings.diff=+b.dataset.d; saveSettings(); syncSeg(); sfx('click'); }));

let nameTarget=null;
function openName(p){ nameTarget=p; $('nameInput').value=p.name; $('nameModal').classList.remove('hidden'); setTimeout(()=>$('nameInput').focus(),50); }
function saveName(){ const v=$('nameInput').value.trim().slice(0,12); if(v&&nameTarget){ nameTarget.name=v; savedNames[nameTarget.id]=v; store.set('names',savedNames); } $('nameModal').classList.add('hidden'); renderCards(); }
$('nameSave').onclick=saveName; $('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') saveName(); });
$('nameModal').addEventListener('click',e=>{ if(e.target.id==='nameModal') $('nameModal').classList.add('hidden'); });

function beginFromSelect(){
  if(S.mode==='pnp'){ if(!(sel.p1&&sel.p2)) return; S.A=byId(sel.p1); S.B=byId(sel.p2); S.K=PLAYERS.find(p=>p.id!==sel.p1&&p.id!==sel.p2); }
  else { S.A=byId(sel.me); store.set('lastMe',sel.me); const others=PLAYERS.filter(p=>p.id!==sel.me);
    S.B = sel.opp==='rnd'||sel.opp===sel.me ? others[Math.random()*others.length|0] : byId(sel.opp);
    S.K = S.mode==='target' ? others[Math.random()*others.length|0] : S.B; }
  titleKeeper=null; startMatch();
}
function showPass(p,cb){
  S.screen='pass'; $('hud').classList.add('hidden'); ['scTitle','scSelect','scPause','scSettings','scResult'].forEach(id=>$(id).classList.add('hidden'));
  $('scPass').classList.remove('hidden'); bg($('passFace'),p); $('passName').textContent=p.name;
  const n=(S.side==='A'?S.res.A:S.res.B).length; $('passInfo').textContent=`Kick ${n+1}${n>=5?' · Sudden death':''} · ${S.K.name} is in goal`;
  keeper=makeKeeper(S.K,false); ball=newBall(); shooter=null; cam=CAMS.shoot; S.phase='idle';
  $('btnPassGo').onclick=()=>{ sfx('click'); $('scPass').classList.add('hidden'); S.screen='game'; $('hud').classList.remove('hidden'); cb(); };
}
function showResult(w){
  showScreen('result'); const face=$('resFace'), crown=face.querySelector('.crown');
  const recap=$('resRecap'); recap.innerHTML='';
  if(S.mode==='target'){
    const sc=S.target.score, key='best_'+S.A.id, best=store.get(key,0), nb=sc>best; if(nb) store.set(key,sc);
    bg(face,S.A); crown.style.display=nb?'block':'none'; $('resSub').textContent='Target Challenge';
    $('resTitle').textContent=nb?'New best!':'Nice shooting!'; $('resScore').innerHTML=`${sc}<span> pts</span>`;
    recap.innerHTML=`<div class="rr"><div class="pf" style="background-image:url(${FACES[S.A.id]})"></div><div class="nm">${esc(S.A.name)}</div><div class="dots">${S.res.A.map(v=>`<div class="dot ${v?'g':'m'}"></div>`).join('')}</div></div>
      <div class="rr" style="opacity:.8;font-size:12px">Goals ${S.res.A.filter(Boolean).length}/10 · Best ${Math.max(sc,best)}</div>`;
    if(nb) { confetti(140); sfx('cheer'); }
  } else {
    const winner = w==='A'?S.A:S.B, ga=S.res.A.filter(Boolean).length, gb=S.res.B.filter(Boolean).length;
    bg(face,winner); crown.style.display='block'; $('resSub').textContent=S.res.A.length>5?'After sudden death':'Full time';
    $('resTitle').textContent = S.mode==='cpu' ? (w==='A'?'You win!':`${winner.name} wins`) : `${winner.name} wins!`;
    $('resScore').innerHTML=`${ga} <span>–</span> ${gb}`;
    [[S.A,S.res.A],[S.B,S.res.B]].forEach(([p,r])=>{ recap.innerHTML+=`<div class="rr"><div class="pf" style="background-image:url(${FACES[p.id]})"></div><div class="nm">${esc(p.name)}</div><div class="dots">${r.map(v=>`<div class="dot ${v?'g':'m'}"></div>`).join('')}</div></div>`; });
    if(S.mode!=='cpu' || w==='A'){ confetti(160); sfx('cheer'); } else sfx('groan');
  }
}

// ---- pause / settings toggles ----
function buildToggles(el){
  const defs=[['sound','🔊 Sound'],['haptics','📳 Vibration'],['aim','🎯 Aim guide (shows where it\'ll go)']];
  el.innerHTML=''; defs.forEach(([k,l])=>{ const d=document.createElement('div'); d.className='tog'+(settings[k]?' on':''); d.innerHTML=`<span>${l}</span><span class="sw"></span>`;
    d.onclick=()=>{ settings[k]=!settings[k]; saveSettings(); d.classList.toggle('on',settings[k]); audioInit(); syncSnd(); sfx('click'); if(k==='haptics'&&settings[k]) buzz([30,60,30]); }; el.appendChild(d); });
}
function togglePause(){
  if(S.screen!=='game') return; S.paused=!S.paused; $('scPause').classList.toggle('hidden',!S.paused);
  if(S.paused){ buildToggles($('pauseToggles')); swipe=null; }
}
$('pauseBtn').onclick=()=>{ sfx('click'); togglePause(); };
function syncSnd(){ $('sndBtn').classList.toggle('off',!settings.sound); }
$('sndBtn').addEventListener('pointerdown',e=>e.stopPropagation());
$('sndBtn').onclick=e=>{ e.stopPropagation(); settings.sound=!settings.sound; saveSettings(); syncSnd(); audioInit(); if(settings.sound) sfx('whistle');
  document.querySelectorAll('.tog').forEach(t=>{ if(t.textContent.includes('Sound')) t.classList.toggle('on',settings.sound); }); };
syncSnd();
if(/audiodebug/.test(location.hash+location.search)){ const dbg=document.createElement('div'); dbg.id='audioDbg'; document.body.appendChild(dbg);
  setInterval(()=>{ dbg.textContent=`ctx: ${actx?actx.state:'none'} ${actx?Math.round(actx.currentTime*10)/10+'s':''}\nsession: ${navigator.audioSession?navigator.audioSession.type:'n/a'}\nsilent el: ${silentEl?(silentEl.paused?'paused':'playing')+' rs'+silentEl.readyState+(silentEl.error?' err'+silentEl.error.code:''):'none'}\nsound: ${settings.sound}  ${audioErr}\n${navigator.userAgent.slice(0,90)}`; },300); }
$('btnResume').onclick=()=>{ sfx('click'); togglePause(); };
$('btnRestart').onclick=()=>{ sfx('click'); S.paused=false; $('scPause').classList.add('hidden'); startMatch(); };
$('btnQuit').onclick=()=>{ sfx('click'); S.paused=false; $('scPause').classList.add('hidden'); goTitle(); };
$('btnSettings').onclick=()=>{ audioInit(); sfx('click'); buildToggles($('setToggles')); syncSeg(); showScreen('settings'); };
$('btnSetDone').onclick=()=>{ sfx('click'); goTitle(); };
$('btnStart').onclick=()=>{ audioInit(); sfx('click'); beginFromSelect(); };
$('btnBack').onclick=()=>{ sfx('click'); goTitle(); };
$('btnAgain').onclick=()=>{ sfx('click'); startMatch(); };
$('btnMenu').onclick=()=>{ sfx('click'); goTitle(); };
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ audioInit(); sfx('click'); openSelect(b.dataset.mode); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && S.screen==='game' && !S.paused) togglePause(); });

function goTitle(){
  showScreen('title'); hideHint(); resetDogs(); cam=CAMS.shoot; shooter=null; S.phase='idle'; S.outcome=null; ball=newBall();
  titleKeeper=makeKeeper(PLAYERS[Math.random()*3|0],false); keeper=null;
}

// ---------- boot ----------
resize(); goTitle(); requestAnimationFrame(frame);
</script>
